  table.tam tr.taparent td{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    white-space:normal!important;border:none!important;padding:5px 0;background:transparent!important;
    font-size:13px;text-align:right}
  /* label each cell */
  table.tam tr.taparent td::before{
    content:attr(data-lbl);text-align:left;color:var(--faint);font-size:10px;text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;flex:0 0 auto;padding-top:2px}
  /* the TA name row: big, no label, full width */
  table.tam tr.taparent td:first-child{
    display:block;text-align:left;font-size:15px;font-weight:600;padding:2px 0 8px;
    border-bottom:1px solid var(--line-soft)!important;margin-bottom:4px}
  table.tam tr.taparent td:first-child::before{display:none}
  table.tam tr.taparent .tan{font-size:15px;word-spacing:normal;letter-spacing:normal}
  table.tam tr.taparent .tachev{font-size:12px;margin-right:6px}
  /* chips + stage bar span full width, left-aligned */
  table.tam tr.taparent td.tbcell,table.tam tr.taparent td.stagecell,table.tam tr.taparent td.tanotecell{
    display:block;text-align:left}
  table.tam tr.taparent td.tbcell::before,table.tam tr.taparent td.stagecell::before,table.tam tr.taparent td.tanotecell::before{
    display:block;margin-bottom:5px}
  .tbwrap{flex-wrap:wrap!important;gap:5px}
  .tbk{font-size:10px!important}
  /* keep the 4 stat cells on one row without inter-cell whitespace pushing wrap */
  table.tam tr.taparent{word-spacing:-4px}
  table.tam tr.taparent td[data-lbl]{word-spacing:normal}
  .stagecell .stagebar,.stagecell svg{width:100%!important}

  /* ===== iPhone TA summary: compact ===== */
  /* hide the save-notes/holdings button */
  #saveNotesBtn,#tasaveBtn,.tam-savebtn{display:none!important}
  /* pack #stocks / L-S / total cap / avg cap into ONE row */
  table.tam tr.taparent td[data-lbl="# stocks"],
  table.tam tr.taparent td[data-lbl="Long / Short"],
  table.tam tr.taparent td[data-lbl="Total cap"],
  table.tam tr.taparent td[data-lbl="Avg cap"]{
    display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    width:24%;box-sizing:border-box;padding:4px 1% 2px 0;text-align:left;font-size:12.5px;gap:1px;vertical-align:top;white-space:nowrap}
  table.tam tr.taparent td[data-lbl="Long / Short"] .ll,
  table.tam tr.taparent td[data-lbl="Long / Short"] .ss{display:inline}
  /* L/S: inline-block cell (not flex) so it stays in the stat row AND "5 / 1" stays on one line */
  table.tam tr.taparent td[data-lbl="Long / Short"]{display:inline-block!important;white-space:nowrap!important;vertical-align:top}
  table.tam tr.taparent td[data-lbl="Long / Short"]::before{content:"L / S";display:block}
  table.tam tr.taparent td[data-lbl="Long / Short"] .ll,
  table.tam tr.taparent td[data-lbl="Long / Short"] .ss{display:inline!important}
  table.tam tr.taparent td[data-lbl="# stocks"]::before,
  table.tam tr.taparent td[data-lbl="Long / Short"]::before,
  table.tam tr.taparent td[data-lbl="Total cap"]::before,
  table.tam tr.taparent td[data-lbl="Avg cap"]::before{
    padding-top:0;margin-bottom:1px;font-size:8.5px}
  /* order them: # stocks, L/S, total, avg — set via source order (already in that order-ish) */
  table.tam tr.taparent td[data-lbl="Top / bottom 3"]{display:none!important}
  table.tam tr.taparent td[data-lbl="★ Best"]{display:block}
  table.tam tr.taparent td.bestcell .tbwrap .tbk:not(:first-child){display:inline-flex!important}
  table.tam tr.taparent td[data-lbl="★ Best"]::before{content:"Starred (by upside)"}
  table.tam tr.tanote-row{display:none!important}
  .tam tr.taparent .tb-mobonly{display:inline-flex!important;flex-direction:row!important;order:-1}   /* drop top/bottom chips on phone to save space */

  /* Stage mix: label + bar on the SAME row */
  table.tam tr.taparent td.stagecell{display:none!important}
  table.tam tr.taparent td.stagecell::before{display:inline-block!important;margin-bottom:0;flex:0 0 auto;white-space:nowrap}
  table.tam tr.taparent td.stagecell .stagebar,table.tam tr.taparent td.stagecell svg{flex:1 1 auto;width:auto!important;min-width:0}

  /* Notes cell: keep compact */
  table.tam tr.taparent td.tanotecell{padding-top:6px}

  /* Expanded company: Mkt cap / fNPV / Upside on ONE row */
  table.tam tr.tcrow .tcgrid{position:relative}
  table.tam tr.tcrow .tc-fin{display:flex!important;gap:10px;margin-top:2px}
  table.tam tr.tcrow .tc-fin > span{flex:1 1 0;min-width:0;font-size:11px;text-align:left;margin:0}
  table.tam tr.tcrow .tc-mc::before,table.tam tr.tcrow .tc-npv::before,table.tam tr.tcrow .tc-up::before{display:block;margin-bottom:1px}
  table.tam tr.tcrow .tc-mc::before,table.tam tr.tcrow .tc-npv::before,table.tam tr.tcrow .tc-up::before{
    display:block;margin-bottom:1px}
  .lscell{text-align:right}
  /* notes editable box full width on mobile */
  .tanotecell .tanote{max-width:100%;width:100%;min-height:34px;font-size:12.5px;text-align:left}

  /* --- expanded child rows: stacked mini-cards --- */
  table.tam tr.tachild{display:block}
  table.tam tr.tachild td{display:block;padding:0}
  table.tam tr.tachild.tchead{display:none}   /* the mini column header isn't useful stacked */
  table.tam tr.tcrow .tcgrid{
    display:flex!important;flex-direction:column;gap:2px;padding:10px 12px;border-top:1px solid var(--line-soft)}
  table.tam tr.tcrow .tc-drug,table.tam tr.tcrow .tc-stg,table.tam tr.tcrow .tc-call,table.tam tr.tcrow .tc-ind{display:none!important}
  table.tam tr.tcrow .tc-tk{order:1}
  table.tam tr.tcrow .tc-pitch{order:2;display:block;font-size:12px!important;color:var(--text)!important;line-height:1.4;margin:2px 0 4px}
  table.tam tr.tcrow .tc-diff{order:3;margin-bottom:6px}
  table.tam tr.tcrow .tc-fin{order:4;display:flex!important;flex-wrap:wrap;gap:12px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line-soft)}
  table.tam tr.tcrow .tc-fin>span{flex:0 0 auto;font-size:11.5px;text-align:left;margin:0}
  table.tam tr.tcrow .tc-peak::before{content:"Peak: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:1px}
  table.tam tr.tcrow.tc-long{border-left:3px solid var(--long)}
  table.tam tr.tcrow.tc-short{border-left:3px solid var(--short)}
  table.tam tr.tcrow .tcgrid > span{display:block;text-align:left;font-size:12px;
    overflow:visible!important;white-space:normal!important;text-overflow:clip!important;
    -webkit-line-clamp:unset!important;line-height:1.4;margin-bottom:2px}
  /* ticker + stage read as a header line */
  table.tam tr.tcrow .tc-tk{font-weight:700;font-size:13px;display:inline-block;margin-right:8px}
  table.tam tr.tcrow .tc-stg{display:inline-block;margin-bottom:6px}
  table.tam tr.tcrow .tc-drug{color:var(--text);font-weight:500}
  /* label the value rows */
  table.tam tr.tcrow .tc-ind::before{content:"Indication: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  table.tam tr.tcrow .tc-diff::before{content:"Differentiation: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  table.tam tr.tcrow .tc-mc::before{content:"Mkt cap: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  table.tam tr.tcrow .tc-npv::before{content:"fNPV: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  table.tam tr.tcrow .tc-up::before{content:"Upside: ";color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  table.tam tr.tcrow .tc-mc,table.tam tr.tcrow .tc-npv,table.tam tr.tcrow .tc-up{display:inline-block;margin-right:14px;text-align:left!important}
  /* expanded-area TA note stays full width */
  .taexp-note-wrap{padding:8px 10px}
  .taexp-note{max-width:100%;width:100%;box-sizing:border-box;font-size:12.5px}

  /* --- main data table: allow horizontal scroll instead of clipping --- */
  .table-scroll,.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* --- portfolio: horizontal scroll, keep the add box usable --- */
  .port-bar{flex-wrap:wrap;gap:10px;padding:10px 12px}
  .port-addbox{min-width:100%;max-width:100%;order:3}
  .port-tablewrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .porttbl th{top:0!important}

  /* --- map: stack legend under plot (already handled at 780px, reinforce) --- */
  .map-body{flex-direction:column}
  .map-talegend{width:100%!important;max-height:160px}

  /* keep the hover tooltip from creating page-width overflow on mobile (hover isn't used on touch) */
  .tbtip{display:none!important}
  /* dcf/cal tables scroll horizontally within their own container */
  #dcfwrap table{min-width:820px}
  #dcfwrap,#calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .porttbl{min-width:900px}

  /* ===== iPhone RETURNS: ticker + 1M/3M/12M/24M + upside%, ticker frozen ===== */
  #retwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 8px 70px}
  #retwrap table.rettbl{min-width:706px;width:706px;table-layout:fixed}   /* wider than screen -> scroll right; ticker frozen */
  #retwrap .rettbl th{top:0}
  /* on-screen columns keep their widths (ticker + 4 returns + upside ~ 362px) */
  #retwrap .rt-name,#retwrap .rt-nameh{width:58px}
  #retwrap .rt-p,#retwrap .rt-ph{width:60px}
  #retwrap .rt-up,#retwrap .rt-uph{width:64px}
  /* off-screen columns (scroll to reveal) */
  #retwrap .rt-di,#retwrap .rt-dih{width:184px;white-space:normal}
  #retwrap .rt-stg,#retwrap .rt-stgh{width:88px}
  #retwrap .rt-ed,#retwrap .rt-edh{width:72px}
  .ret-head .ret-ctrl,.ret-hint{display:none}                 /* de-clutter header */
  .ret-head{padding:8px 4px}
  /* hide only: rank, bar, cap, MC/fNPV, 36M (drug/indication, stage, eff/diff stay — scroll right) */
  #retwrap .rk,#retwrap .rt-barcol,
  #retwrap .rt-mch,#retwrap .rt-mc,
  #retwrap .rt-pvh,#retwrap .rt-pv,
  #retwrap .r36col{display:none!important}
  /* ticker only (hide full name) */
  #retwrap .rt-nm{display:none}
  #retwrap .rt-name,#retwrap .rt-nameh{padding:7px 6px!important;white-space:nowrap;overflow:hidden}
  #retwrap .rt-tk{font-size:12.5px;font-weight:700}
  #retwrap .rt-p,#retwrap .rt-up{text-align:right}
  /* upside as % */
  #retwrap .upx{display:none}
  #retwrap .uppct{display:inline;font-weight:600}
  /* compact cells so 4 returns + upside fit ~390px */
  #retwrap th,#retwrap td{padding:7px 5px;font-size:11.5px}
  #retwrap .rt-uph{font-size:0}
  #retwrap .rt-uph::after{content:"Upside";font-size:11px}
  /* freeze the ticker column */
  #retwrap .rt-name,#retwrap .rt-nameh{position:sticky;left:0;z-index:3;background:var(--panel);box-shadow:1px 0 0 var(--line)}
  #retwrap tr.grp .rt-name{background:transparent}
  #retwrap tr.grp td{white-space:nowrap;overflow:hidden}
  #retwrap .rt-name .rt-tk{display:inline-block;max-width:52px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  #retwrap thead .rt-nameh{z-index:5;background:var(--bg2,var(--panel))}

  /* ===== MAIN DATA TABLE -> STACKED CARDS (iPhone) ===== */
  .wrap{padding:0 10px 80px;overflow-x:hidden}
  .wrap > table{min-width:0;width:100%;display:block}
  .wrap > table thead{display:none}                    /* header row hidden; sort via controls */
  .wrap > table tbody{display:block}
  .wrap > table colgroup{display:none}
  /* group header rows stay as slim dividers */
  .wrap > table tr.grp{display:block;margin:14px 0 8px}
  .wrap > table tr.grp td{display:block;padding:0!important;top:auto!important}
  /* each stock row -> a tappable card */
  .wrap > table tr[data-i]{
    display:grid;grid-template-columns:1fr auto;grid-template-areas:'id call' 'meta val';
    gap:4px 10px;align-items:center;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);
    padding:12px 13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.25);position:relative}
  .wrap > table tr[data-i]>td{display:none;padding:0;border:none!important}   /* hide all by default */
  .wrap > table tr[data-i] .rail{display:none}
  /* show only the essentials, placed into grid areas */
  .wrap > table tr[data-i] .namecell{display:block;grid-area:id}
  .wrap > table tr[data-i] .namecell .tk{font-size:16px;font-weight:700}
  .wrap > table tr[data-i] .namecell .nm{font-size:11px;color:var(--dim);white-space:normal;line-height:1.25}
  .wrap > table tr[data-i] .call-cell{display:flex;grid-area:call;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap}
  .wrap > table tr[data-i] .call-cell .cbadge{font-size:11px;padding:3px 8px}
  .wrap > table tr[data-i] .call-cell .up{font-size:13px;font-weight:700}
  /* meta line: stage + cap under the name */
  .wrap > table tr[data-i] .mc-cell{display:flex;grid-area:val;justify-content:flex-end;align-items:baseline;gap:6px}
  .wrap > table tr[data-i] .mc-cell .mcv{font-size:14px;font-weight:600;color:var(--cyan)}
  .wrap > table tr[data-i] .mc-cell .prc{font-size:10px;color:var(--faint)}
  .wrap > table tr[data-i] .mc-cell::before{content:'Cap';font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-right:2px;align-self:center}
  /* stage badge shown in meta area (reuse the stage td = 4th child) */
  .wrap > table tr[data-i] td:nth-of-type(4){display:flex;grid-area:meta;align-items:center}
  .wrap > table tr[data-i] td:nth-of-type(4) .badge.stg{font-size:10px}
  .wrap > table tr[data-i].hovlit td,.wrap > table tr[data-i] .hovzone.hovlit{background:transparent!important;box-shadow:none!important}
  /* tap affordance */
  .wrap > table tr[data-i]::after{content:'›';position:absolute;right:10px;top:12px;color:var(--faint);font-size:18px;line-height:1}
  /* uniform green(long)/red(short) card coloring; no per-field colors */
  .wrap > table tr[data-i].cdl{background:var(--long-bg)!important;border-color:var(--long)!important;border-left:4px solid var(--long)!important}
  .wrap > table tr[data-i].cds{background:var(--short-bg)!important;border-color:var(--short)!important;border-left:4px solid var(--short)!important}
  .wrap > table tr[data-i] .mc-cell .mcv{color:var(--text)!important}
  .wrap > table tr[data-i] .call-cell .up{color:var(--text)!important}
  .wrap > table tr[data-i] .call-cell .cbadge{background:transparent!important;color:var(--text)!important;border:1px solid var(--line)!important}
  .wrap > table tr[data-i] td:nth-of-type(4) .badge.stg{background:transparent!important;color:var(--dim)!important;border:1px solid var(--line)!important}
  .wrap > table tr[data-i] td.namecell,.wrap > table tr[data-i] td.mc-cell,.wrap > table tr[data-i] td.call-cell,.wrap > table tr[data-i]>td{background:transparent!important}
  /* the tooltip stays disabled on touch; tapping opens the drawer (which shows the highlighted thesis) */
  .tbtip{display:none!important}

  /* drawer: full-width sheet on mobile, thesis prominent */
  .drawer{width:100%!important;max-width:100%!important}
  .thesis mark.thi{padding:1px 3px}
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Thesis tab ===== */
.theswrap{padding:22px 26px 70px}
.thes-wrap-inner{max-width:1000px;margin:0 auto}
.thes-search{margin-bottom:18px}
.thes-search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;font-size:15px;color:var(--text);font-family:inherit;outline:none}
.thes-search input:focus{border-color:var(--accent,#5b8def)}
.thes-search input::placeholder{color:var(--faint)}
.thes-empty{color:var(--faint);font-size:14px;padding:24px 4px;text-align:center}
.thes-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thes-card.long{border-left:4px solid var(--long)}
.thes-card.short{border-left:4px solid var(--short)}
.thes-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.thes-tk{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--text);letter-spacing:.01em}
.thes-nm{font-size:14px;color:var(--dim)}
.thes-ta{margin-left:auto;font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.thes-call{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.thes-call.long{color:var(--long);border-color:var(--long);background:var(--long-bg)}
.thes-call.short{color:var(--short);border-color:var(--short);background:var(--short-bg)}
.thes-row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:13px 20px;border-top:1px solid var(--line-soft,rgba(255,255,255,.05))}
.thes-row:first-of-type{border-top:none}
.thes-k{color:var(--faint);text-transform:uppercase;font-size:11px;letter-spacing:.06em;font-weight:700;padding-top:2px}
.thes-v{font-size:13.5px;line-height:1.55;color:var(--text);min-width:0;overflow-wrap:anywhere}
.thes-v b{color:var(--text)}
.thes-v .pos{color:var(--long)}
.thes-v .neg{color:var(--short)}
.thes-mono{font-family:var(--mono);font-size:12.5px;line-height:1.7}
.thes-dim{color:var(--faint)}
.tap-thes{display:flex;align-items:center;position:relative;z-index:400}
.tap-thes input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--text);width:158px;outline:none;font-family:inherit}
.tap-thes input:focus{border-color:var(--accent,#5b8def);width:200px}
.tap-thes input::placeholder{color:var(--faint)}
table.tam tr.tcrow .tc-tk{cursor:pointer}
table.tam tr.tcrow .tc-tk:hover{text-decoration:underline;text-decoration-color:var(--faint)}
.thesmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:300;align-items:flex-start;justify-content:center;padding:78px 16px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.thesmodal.open{display:flex}
.thesm-card{position:relative;width:100%;max-width:920px;margin:auto 0}
.thesm-x{position:absolute;top:-32px;right:0;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.8}
.thesm-x:hover{opacity:1}
@media(max-width:560px){.tap-thes{flex:1 1 100%;order:9}.tap-thes input,.tap-thes input:focus{width:100%}.thesmodal{padding:60px 10px 20px}.thesm-x{top:-28px}}
@media(max-width:560px){
  .theswrap{padding:12px 12px 80px}
  .thes-row{grid-template-columns:1fr;gap:3px;padding:11px 14px}
  .thes-k{padding-top:0}
  .thes-tk{font-size:19px}
  .thes-ta{margin-left:0;flex-basis:100%}
  .thes-mono{font-size:11.5px}
}

.catsched{list-style:none;margin:0;padding:0}
.catsched li{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line-soft,rgba(255,255,255,.06));align-items:baseline}
.catsched li:first-child{border-top:none}
.catsched .cs-t{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.catsched .cs-e{font-size:12.5px;line-height:1.45;color:var(--text)}
.catsched li.key{background:var(--amber-bg,rgba(245,180,80,.12));border-radius:7px;border-top:none;margin:2px -9px;padding:8px 9px}
.catsched li.key .cs-e{color:var(--amber);font-weight:600}
.catsched li.key .cs-t{color:var(--amber)}

body{background:var(--bg)}
.shr-bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}

let taView='simple', tamSelectedTA=null;
let tasSort={k:'up',dir:-1};
const CALL_RANK={'STRONG BUY':6,'LONG':5,'WATCH':4,'HOLD':3,'AVOID':2,'SHORT':1,'STRONG SHORT':0};
const TA_GROUPS = {Cancer:'#FB6B6B',Immuno:'#56B4D3',Metabolic:'#F4B740',Neuro:'#A78BFA',Cardio:'#FB7185',
  Blood:'#F87171',Eye:'#38BDF8',Lung:'#34D399',Derm:'#FBBF24',Psych:'#C084FC',Pain:'#F472B6',
  Infectious:'#2DD4BF',Kidney:'#60A5FA',Liver:'#FB923C',Muscle:'#4ADE80',GI:'#FCD34D',
  Neurodegeneration:'#A78BFA',Women:'#F9A8D4',Dental:'#94A3B8'};
function taColor(ta){if(!ta)return '#8597A1';for(const k in TA_GROUPS){if(ta.startsWith(k))return TA_GROUPS[k];}return '#8597A1';}
function fmtBtdDate(s){ if(!s) return s; var d=new Date(s); if(isNaN(d.getTime())) return s;
  var mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'), yy=String(d.getFullYear()).slice(-2);
  return mm+'/'+dd+'/'+yy; }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMC=v=>{if(v==null||isNaN(v))return '\u2014';if(v>=1e9)return '$'+(v/1e9).toFixed(v>=1e10?0:1)+'B';if(v>=1e6)return '$'+Math.round(v/1e6)+'M';return '$'+Math.round(v/1e3)+'K';};
const fmtSales=v=>{if(v==null||isNaN(v))return '\u2014';const s=v<0?'-':'',a=Math.abs(v);if(a>=1e9)return s+'$'+(a/1e9).toFixed(1)+'B';if(a>=1e6)return s+'$'+Math.round(a/1e6)+'M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'K';return s+'$'+Math.round(a);};
function callBadgeCls(c){
  if(c==='STRONG BUY')return 'long sbest'; if(c==='LONG')return 'long'; if(c==='WATCH')return 'watch';
  if(c==='STRONG SHORT')return 'short sbest'; if(c==='SHORT')return 'short'; if(c==='AVOID')return 'avoid';
  return 'none';
}
function groupByTA(){
  const stats={};
  SIMPLE_ROWS.forEach(r=>{
    const ta=r.ta||'\u2014';
    if(!stats[ta])stats[ta]={ta,n:0,total:0,withMc:0,L:0,S:0,rows:[]};
    stats[ta].n++; stats[ta].rows.push(r);
    if(typeof r.mc==='number'){stats[ta].total+=r.mc;stats[ta].withMc++;}
    const dir=(c=>{c=(c||'').toUpperCase();if(c==='STRONG BUY'||c==='LONG')return 'long';if(c==='STRONG SHORT'||c==='SHORT')return 'short';return null;})(r.call);
    if(dir==='long')stats[ta].L++; else if(dir==='short')stats[ta].S++;
  });
  return Object.values(stats).sort((a,b)=>a.ta.localeCompare(b.ta));
}
function buildSimpleView(arr, grandN){
  document.getElementById('tamsub').textContent='';
  const sortVal={call:x=>CALL_RANK[(x.call||'').toUpperCase()]??-1, mc:x=>(typeof x.mc==='number'?x.mc:-Infinity), peak:x=>(typeof x.peak_sales==='number'?x.peak_sales:-Infinity), up:x=>(typeof x.up==='number'?x.up:-Infinity)}[tasSort.k];
  const arrow=c=>tasSort.k===c?(tasSort.dir<0?' \u25bc':' \u25b2'):'';
  const taBlock=s=>{
    const list=s.rows.slice().sort((a,b)=>tasSort.dir*(sortVal(a)-sortVal(b)));
    const rows=list.map(r=>'<div class="tas-row'+(r.starred?' starred':'')+(r.favorite?' favorite':'')+'">'
      +'<span class="tas-tk" title="'+(r.favorite?'Editorial pick: best risk-adjusted 1-3yr name in this TA':'')+'">'+esc(r.ticker)+'</span>'
      +'<span class="tas-call"><span class="cbadge '+callBadgeCls(r.call)+'">'+esc((r.call||'\u2014').replace('STRONG ','S.'))+'</span></span>'
      +'<span class="tas-mc">'+fmtMC(r.mc)+'</span>'
      +'<span class="tas-peak">'+(r.peak_sales?fmtSales(r.peak_sales):'\u2014')+'</span>'
      +'<span class="tas-up '+(r.up==null?'':(r.up>=0?'pos':'neg'))+'">'+(r.up==null?'\u2014':(r.up>=0?'+':'')+Math.round(r.up)+'%')+'</span>'
      +'<span class="tas-pitch">'+(r.pitch?esc(r.pitch):'\u2014')+'</span>'
      +'</div>').join('');
    return '<div class="tas-group">'
      +'<div class="tas-ghead'+(s.ta===tamSelectedTA?' sel':'')+'" data-ta="'+esc(s.ta)+'"><span class="ta-dot" style="background:'+taColor(s.ta)+';width:8px;height:8px"></span>'+esc(s.ta)+'<span class="tas-gn">'+s.n+'</span></div>'
      +'<div class="tas-colhead"><span></span><span data-k="call" class="tas-sortable">Call'+arrow('call')+'</span><span data-k="mc" class="tc-r tas-sortable">Mkt cap'+arrow('mc')+'</span><span data-k="peak" class="tc-r tas-sortable">Peak sales'+arrow('peak')+'</span><span data-k="up" class="tc-r tas-sortable">Upside'+arrow('up')+'</span><span>Concise elevator pitch</span></div>'
      +rows
      +'</div>';
  };
  document.getElementById('tambody').innerHTML='<div class="tap-hint">Simple view \u2014 every company, one line each. Click Call / Mkt cap / Peak sales / Upside to sort. (Static snapshot, not connected to live data.)</div>'+arr.map(taBlock).join('');

    const k=el.dataset.k;
    if(tasSort.k===k)tasSort.dir*=-1; else tasSort={k,dir:-1};
    buildSimpleView(arr, grandN);
  });
  buildBigPicture(arr, grandN);
}
function computeKeyOwners(ticker){
  var baked=(typeof HOLDERS_BAKED!=='undefined')?HOLDERS_BAKED[ticker]:null;
  if(!baked || !baked.rows || !baked.rows.length) return '';
  return baked.rows
    .filter(function(x){ return SPECIALIST_INVESTORS && SPECIALIST_INVESTORS.has(x.name) && x.pct!=null; })
    .map(function(x){ var nm=(typeof SPECIALIST_NICKNAMES!=='undefined'&&SPECIALIST_NICKNAMES[x.name])||x.name; return nm+' owns '+Math.round(+x.pct)+'%'; })
    .join('<br>');
}
function buildBestView(arr, grandN){
